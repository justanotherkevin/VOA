name: CI

on:
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - run: npm test

  e2e:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      # The whisper-tiny cache lives inside node_modules, and `npm ci` above
      # deletes node_modules before reinstalling, so this restore must run
      # after `npm ci`, not before it.
      - uses: actions/cache@v4
        with:
          path: node_modules/@xenova/transformers/.cache
          key: whisper-cache-${{ runner.os }}-tiny-v1
          restore-keys: |
            whisper-cache-${{ runner.os }}-

      - run: npm run test:e2e
